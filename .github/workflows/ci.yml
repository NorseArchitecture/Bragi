name: CI

on:
  pull_request:
    branches: [master]

permissions:
  packages: read
  pull-requests: write

jobs:
  gate:
    uses: NorseArchitecture/.github/.github/workflows/ci-build-test.yml@master
    secrets: inherit
    with:
      minimum_coverage: 0

  story-driver:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test StoryDriver module
        run: npm test
